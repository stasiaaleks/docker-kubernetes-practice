apiVersion: v1
kind: Pod
metadata:
  name: {{ include "course-app.fullname" . }}-test-redis-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "course-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
  - name: redis-cli
    image: redis:7-alpine
    command:
    - redis-cli
    - -u
    - {{ .Values.app.redisUrl | quote }}
    - ping
