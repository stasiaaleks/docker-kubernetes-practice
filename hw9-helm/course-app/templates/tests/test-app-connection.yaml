apiVersion: v1
kind: Pod
metadata:
  name: {{ include "course-app.fullname" . }}-test-app-connection
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "course-app.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
  - name: wget
    image: busybox
    command:
    - wget
    - --spider
    - --timeout=10
    - "http://{{ include "course-app.fullname" . }}:{{ .Values.service.port }}/"
