version: "3.8"

services:
  course-app:
    image: ghcr.io/stasiaaleks/course-app:latest
    ports:
      - "8080:8080"
    environment:
      - APP_MESSAGE="Connected to Course Demo App"
      - APP_STORE=sqlite
      - APP_DB_PATH=/data/app.db
    volumes:
      - appdata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      - redis
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  appdata: